<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      padding: 16px 14px;
      background: #fff;
      color: #333;
      font-size: 13px;
    }
    h3 {
      font-size: 15px;
      margin-bottom: 4px;
      color: #1a73e8;
    }
    .subtitle {
      font-size: 11px;
      color: #999;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 3px;
      font-size: 12px;
      color: #555;
    }
    select, input[type="number"], input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.2s;
      background: #fff;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
    }
    input[readonly] {
      background: #FFF9C4;
      font-weight: 600;
      font-size: 15px;
      color: #2e7d32;
      cursor: default;
    }

    .row-2 { display: flex; gap: 8px; }
    .row-2 > div { flex: 1; }
    .row-3 { display: flex; gap: 8px; }
    .row-3 > div { flex: 1; }

    .btn-save {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #1557b0; }
    .btn-save:disabled { background: #bbb; cursor: not-allowed; }
    .btn-load {
      width: 100%;
      padding: 6px;
      background: none;
      color: #1a73e8;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-load:hover { background: #f0f7ff; }

    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .status.success {
      display: block;
      background: #E8F5E9;
      color: #2e7d32;
    }
    .status.error {
      display: block;
      background: #FFEBEE;
      color: #c62828;
    }
    .status.loading {
      display: block;
      background: #FFF3E0;
      color: #e65100;
    }

    .total-row {
      padding: 8px 10px;
      margin-top: 6px;
      border: 1px solid #81c784;
      border-radius: 6px;
      font-size: 11px;
      color: #2e7d32;
      text-align: center;
    }
    .total-row .val { font-weight: 700; font-size: 15px; }

    hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 14px 0;
    }
  </style>
</head>
<body>
  <h3>🥥 กรอกข้อมูลมะพร้าวน้ำหอม</h3>
  <p class="subtitle">เลือกจังหวัด → แปลง → ทะลาย → กรอกข้อมูล</p>

  <!-- Location selectors -->
  <div class="row-2">
    <div class="form-group">
      <label>จังหวัด</label>
      <select id="province" onchange="loadExisting()">
        <option value="">-- เลือก --</option>
        <option value="นครปฐม">นครปฐม</option>
        <option value="ราชบุรี">ราชบุรี</option>
        <option value="สมุทรสาคร">สมุทรสาคร</option>
        <option value="สมุทรสงคราม">สมุทรสงคราม</option>
      </select>
    </div>
  </div>

  <div class="row-2">
    <div class="form-group">
      <label>แปลงที่</label>
      <select id="plot" onchange="loadExisting()">
        <option value="">-- เลือก --</option>
      </select>
    </div>
    <div class="form-group">
      <label>ทะลายที่</label>
      <select id="bunch" onchange="loadExisting()">
        <option value="">-- เลือก --</option>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </div>
  </div>

  <button class="btn-load" onclick="loadExisting()">📂 โหลดข้อมูลที่เคยกรอก</button>

  <hr>

  <!-- Data inputs -->
  <div class="row-3">
    <div class="form-group">
      <label>ผลคุณภาพ (ผล) ❶</label>
      <input type="number" id="quality" min="0" step="1" onchange="calcTotal()" oninput="calcTotal()">
    </div>
    <div class="form-group">
      <label>ต่ำกว่าเกณฑ์ (ผล) ❷</label>
      <input type="number" id="below" min="0" step="1" onchange="calcTotal()" oninput="calcTotal()">
    </div>
    <div class="form-group">
      <label>ผลเสีย ❸</label>
      <input type="number" id="damaged" min="0" step="1" onchange="calcTotal()" oninput="calcTotal()">
    </div>
  </div>

  <div class="total-row">
    ผลผลิตทั้งหมด (❶+❷+❸) = <span class="val" id="totalDisplay">0</span> ผล
  </div>

  <div class="row-2">
    <div class="form-group">
      <label>นํ้าหนักผลเฉลี่ย (กก.)</label>
      <input type="number" id="weight" min="0" step="0.01">
    </div>
    <div class="form-group">
      <label>เส้นรอบวงเฉลี่ย (ซม.)</label>
      <input type="number" id="circum" min="0" step="0.01">
    </div>
  </div>

  <div class="form-group">
    <label>หมายเหตุ</label>
    <input type="text" id="notes" placeholder="(ถ้ามี)">
  </div>

  <button class="btn-save" id="btnSave" onclick="save()">💾 บันทึกข้อมูล</button>

  <div class="status" id="status"></div>

  <script>
    // Populate plots dropdown
    const plotSelect = document.getElementById('plot');
    for (let i = 1; i <= 10; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = 'แปลงที่ ' + i;
      plotSelect.appendChild(opt);
    }

    function calcTotal() {
      const q = parseInt(document.getElementById('quality').value) || 0;
      const b = parseInt(document.getElementById('below').value) || 0;
      const d = parseInt(document.getElementById('damaged').value) || 0;
      document.getElementById('totalDisplay').textContent = q + b + d;
    }

    function getFormData() {
      return {
        province: document.getElementById('province').value,
        plot: document.getElementById('plot').value,
        bunch: document.getElementById('bunch').value,
        quality: document.getElementById('quality').value,
        below: document.getElementById('below').value,
        damaged: document.getElementById('damaged').value,
        weight: document.getElementById('weight').value,
        circum: document.getElementById('circum').value,
        notes: document.getElementById('notes').value
      };
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function loadExisting() {
      const data = getFormData();
      if (!data.province || !data.plot || !data.bunch) return;

      setStatus('⏳ กำลังโหลด...', 'loading');
      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('status').className = 'status';
          if (result) {
            document.getElementById('quality').value = result.quality;
            document.getElementById('below').value = result.below;
            document.getElementById('damaged').value = result.damaged;
            document.getElementById('weight').value = result.weight;
            document.getElementById('circum').value = result.circum;
            document.getElementById('notes').value = result.notes || '';
            calcTotal();
            setStatus('✅ โหลดข้อมูลเดิมแล้ว', 'success');
          } else {
            setStatus('ยังไม่เคยกรอกข้อมูล', 'loading');
          }
        })
        .withFailureHandler(function(err) {
          setStatus('❌ โหลดล้มเหลว: ' + err.message, 'error');
        })
        .loadEntry(data.province, data.plot, data.bunch);
    }

    function save() {
      const data = getFormData();
      if (!data.province) { setStatus('⚠️ กรุณาเลือกจังหวัด', 'error'); return; }
      if (!data.plot) { setStatus('⚠️ กรุณาเลือกแปลงที่', 'error'); return; }
      if (!data.bunch) { setStatus('⚠️ กรุณาเลือกทะลายที่', 'error'); return; }
      if (!data.quality && !data.below && !data.damaged) {
        setStatus('⚠️ กรุณากรอกจำนวนผลอย่างน้อย 1 ช่อง', 'error');
        return;
      }

      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = '⏳ กำลังบันทึก...';
      setStatus('', '');

      google.script.run
        .withSuccessHandler(function(msg) {
          btn.disabled = false;
          btn.textContent = '💾 บันทึกข้อมูล';
          setStatus('✅ ' + msg, 'success');
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = '💾 บันทึกข้อมูล';
          setStatus('❌ บันทึกไม่สำเร็จ: ' + err.message, 'error');
        })
        .saveEntry(data.province, data.plot, data.bunch,
                   data.quality, data.below, data.damaged,
                   data.weight, data.circum, data.notes);
    }
  </script>
</body>
</html>
