<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Kanit', 'Google Sans', Roboto, 'Noto Sans Thai', sans-serif;
      background: #F6F8FB;
      color: #243044;
      padding: 28px 32px;
      font-size: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h2 { font-size: 26px; color: #3D73C9; }
    .header .emoji { font-size: 30px; }
    .subtitle { color: #68758A; font-size: 15px; margin-bottom: 22px; }
    .nav-btn {
      border: 1.5px solid #D7DFEA;
      background: #fff;
      color: #3D73C9;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      text-decoration: none;
    }
    .nav-btn:hover { background: #EAF2FF; border-color: #6EA8FE; }

    /* Round pills */
    .round-section { margin-bottom: 20px; }
    .round-label { font-size: 14px; font-weight: 600; color: #68758A; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .round-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .round-pill {
      padding: 9px 16px;
      border-radius: 20px;
      border: 1.5px solid #D7DFEA;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .round-pill:hover { border-color: #6EA8FE; background: #EAF2FF; }
    .round-pill.active {
      background: #6EA8FE;
      color: #fff;
      border-color: #6EA8FE;
      font-weight: 600;
    }
    .round-pill .date-range { font-size: 12px; opacity: 0.82; display: block; margin-top: 2px; }

    /* Form grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 22px;
      margin-bottom: 18px;
    }
    .form-group { }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #68758A;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .form-group select, .form-group input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #D7DFEA;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
    }
    .form-group select:focus, .form-group input:focus {
      outline: none;
      border-color: #6EA8FE;
      box-shadow: 0 0 0 3px rgba(110,168,254,0.18);
    }
    .form-group input.readonly {
      background: #FFF5DA;
      font-weight: 700;
      font-size: 20px;
      color: #3B805E;
      text-align: center;
      cursor: default;
    }
    .form-group.full { grid-column: 1 / -1; }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn {
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: #6EA8FE;
      color: #fff;
      flex: 1;
    }
    .btn-primary:hover { background: #4D8CE8; }
    .btn-primary:disabled { background: #bbb; cursor: not-allowed; }
    .btn-secondary {
      background: #fff;
      color: #3D73C9;
      border: 1.5px solid #D7DFEA;
    }
    .btn-secondary:hover { background: #EAF2FF; border-color: #6EA8FE; }

    /* Status */
    .status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      display: none;
    }
    .status.success { display: block; background: #E7F6EF; color: #3B805E; }
    .status.error { display: block; background: #FDECEC; color: #B85353; }
    .status.info { display: block; background: #EAF2FF; color: #3D73C9; }

    hr { border: none; border-top: 1px solid #e8eaed; margin: 16px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-wrap">
      <span class="emoji">🥥</span>
      <h2>กรอกข้อมูลมะพร้าวน้ำหอม</h2>
    </div>
    <a class="nav-btn" href="<?= webAppUrl ?>" target="_top">📊 Dashboard</a>
  </div>
  <p class="subtitle">เลือกรอบ → จังหวัด → แปลง → ทะลาย → กรอกข้อมูล</p>

  <!-- ROUND SELECTOR -->
  <div class="round-section">
    <div class="round-label">📅 เลือกรอบการเก็บ</div>
    <div class="round-pills" id="roundPills"></div>
    <input type="hidden" id="round" value="">
  </div>

  <!-- LOCATION -->
  <div class="form-grid">
    <div class="form-group">
      <label>จังหวัด</label>
      <select id="province" onchange="autoLoad()">
        <option value="">-- เลือกจังหวัด --</option>
        <option value="นครปฐม">นครปฐม</option>
        <option value="ราชบุรี">ราชบุรี</option>
        <option value="สมุทรสาคร">สมุทรสาคร</option>
        <option value="สมุทรสงคราม">สมุทรสงคราม</option>
      </select>
    </div>
    <div class="form-group">
      <label>แปลงที่</label>
      <select id="plot" onchange="autoLoad()"></select>
    </div>
    <div class="form-group">
      <label>ทะลายที่</label>
      <select id="bunch" onchange="autoLoad()">
        <option value="">-- เลือก --</option>
        <option value="1">ทะลายที่ 1</option>
        <option value="2">ทะลายที่ 2</option>
      </select>
    </div>
    <div class="form-group">
      <button class="btn btn-secondary" onclick="loadExisting()" style="margin-top:18px;width:100%;">
        📂 โหลดข้อมูลเดิม
      </button>
    </div>
  </div>

  <hr>

  <!-- DATA INPUT -->
  <div class="form-grid">
    <div class="form-group">
      <label>❶ จำนวนผลคุณภาพ (ผล)</label>
      <input type="number" id="quality" min="0" step="1" oninput="calcTotal()" placeholder="0">
    </div>
    <div class="form-group">
      <label>❷ จำนวนผลตํ่ากว่าเกณฑ์ (ผล)</label>
      <input type="number" id="below" min="0" step="1" oninput="calcTotal()" placeholder="0">
    </div>
    <div class="form-group">
      <label>❸ จำนวนผลเสีย (ผล)</label>
      <input type="number" id="damaged" min="0" step="1" oninput="calcTotal()" placeholder="0">
    </div>
    <div class="form-group">
      <label>📦 ผลผลิตทั้งหมด = ❶+❷+❸</label>
      <input type="text" id="totalDisplay" class="readonly" value="0" readonly>
    </div>
    <div class="form-group">
      <label>⚖️ นํ้าหนักผลเฉลี่ย (กก.)</label>
      <input type="number" id="weight" min="0" step="0.01" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>📏 เส้นรอบวงเฉลี่ย (ซม.)</label>
      <input type="number" id="circum" min="0" step="0.01" placeholder="0.00">
    </div>
    <div class="form-group full">
      <label>📝 หมายเหตุ</label>
      <input type="text" id="notes" placeholder="(ถ้ามี)">
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="google.script.host.close()">ปิด</button>
    <button class="btn btn-primary" id="btnSave" onclick="save()">💾 บันทึกข้อมูล</button>
  </div>

  <div class="status" id="status"></div>

  <script>
    // --- ROUND PILLS ---
    const roundDates = [
      { num: 1, start: '01/06/69', end: '21/06/69' },
      { num: 2, start: '22/06/69', end: '12/07/69' },
      { num: 3, start: '13/07/69', end: '02/08/69' },
      { num: 4, start: '03/08/69', end: '23/08/69' },
      { num: 5, start: '24/08/69', end: '13/09/69' },
      { num: 6, start: '14/09/69', end: '04/10/69' }
    ];

    const container = document.getElementById('roundPills');
    roundDates.forEach(function(rd) {
      const pill = document.createElement('div');
      pill.className = 'round-pill';
      pill.innerHTML = 'รอบที่ ' + rd.num + '<span class="date-range">' + rd.start + ' – ' + rd.end + '</span>';
      pill.onclick = function() {
        document.querySelectorAll('.round-pill').forEach(function(p) { p.classList.remove('active'); });
        pill.classList.add('active');
        document.getElementById('round').value = rd.num;
        autoLoad();
      };
      container.appendChild(pill);
    });

    // Default: select round 1
    document.querySelector('.round-pill').classList.add('active');
    document.getElementById('round').value = '1';

    // --- PLOT DROPDOWN ---
    const plotSelect = document.getElementById('plot');
    for (let i = 1; i <= 10; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = 'แปลงที่ ' + i;
      plotSelect.appendChild(opt);
    }

    // --- HELPERS ---
    function calcTotal() {
      const q = parseInt(document.getElementById('quality').value) || 0;
      const b = parseInt(document.getElementById('below').value) || 0;
      const d = parseInt(document.getElementById('damaged').value) || 0;
      document.getElementById('totalDisplay').value = q + b + d;
    }

    function getForm() {
      return {
        round: document.getElementById('round').value,
        province: document.getElementById('province').value,
        plot: document.getElementById('plot').value,
        bunch: document.getElementById('bunch').value,
        quality: document.getElementById('quality').value,
        below: document.getElementById('below').value,
        damaged: document.getElementById('damaged').value,
        weight: document.getElementById('weight').value,
        circum: document.getElementById('circum').value,
        notes: document.getElementById('notes').value
      };
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function autoLoad() {
      const f = getForm();
      if (f.round && f.province && f.plot && f.bunch) {
        loadExisting();
      }
    }

    // --- LOAD ---
    function loadExisting() {
      const f = getForm();
      if (!f.round || !f.province || !f.plot || !f.bunch) return;

      setStatus('⏳ กำลังโหลด...', 'info');
      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('status').className = 'status';
          if (result) {
            document.getElementById('quality').value = result.quality;
            document.getElementById('below').value = result.below;
            document.getElementById('damaged').value = result.damaged;
            document.getElementById('weight').value = result.weight;
            document.getElementById('circum').value = result.circum;
            document.getElementById('notes').value = result.notes || '';
            calcTotal();
            setStatus('✅ โหลดข้อมูลแล้ว', 'success');
            setTimeout(function() { document.getElementById('status').className = 'status'; }, 2000);
          } else {
            // Clear form
            document.getElementById('quality').value = '';
            document.getElementById('below').value = '';
            document.getElementById('damaged').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('circum').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('totalDisplay').value = '0';
            setStatus('📝 ยังไม่เคยกรอกข้อมูล', 'info');
          }
        })
        .withFailureHandler(function(err) {
          setStatus('❌ โหลดล้มเหลว: ' + err.message, 'error');
        })
        .loadEntry(f.round, f.province, f.plot, f.bunch);
    }

    // --- SAVE ---
    function save() {
      const f = getForm();
      if (!f.round) { setStatus('⚠️ กรุณาเลือกรอบ', 'error'); return; }
      if (!f.province) { setStatus('⚠️ กรุณาเลือกจังหวัด', 'error'); return; }
      if (!f.plot) { setStatus('⚠️ กรุณาเลือกแปลงที่', 'error'); return; }
      if (!f.bunch) { setStatus('⚠️ กรุณาเลือกทะลายที่', 'error'); return; }
      if (!f.quality && !f.below && !f.damaged) {
        setStatus('⚠️ กรุณากรอกจำนวนผลอย่างน้อย 1 ช่อง', 'error');
        return;
      }

      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = '⏳ กำลังบันทึก...';

      google.script.run
        .withSuccessHandler(function(msg) {
          btn.disabled = false;
          btn.textContent = '💾 บันทึกข้อมูล';
          setStatus(msg, 'success');
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = '💾 บันทึกข้อมูล';
          setStatus('❌ ' + err.message, 'error');
        })
        .saveEntry(f.round, f.province, f.plot, f.bunch,
                   f.quality, f.below, f.damaged,
                   f.weight, f.circum, f.notes);
    }

    // Auto-load on initial open
    setTimeout(autoLoad, 300);
  </script>
</body>
</html>
